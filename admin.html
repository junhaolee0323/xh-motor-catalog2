<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
/>

<title>XH MOTOR ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f7;
  color:#17121d;
}

button,
input,
textarea,
select{
  font:inherit;
}

.header{
  background:linear-gradient(
    120deg,
    #651bd4,
    #8d32f5,
    #651bd4
  );

  color:#fff;

  padding:
    18px
    max(20px,calc((100% - 1100px)/2));

  display:flex;
  align-items:center;
  justify-content:space-between;

  position:sticky;
  top:0;
  z-index:50;

  box-shadow:
    0 5px 20px rgba(70,20,130,.2);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:55px;
  height:55px;
  border-radius:15px;
  object-fit:cover;
  background:#fff;
}

.logo-title{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.logo-sub{
  font-size:13px;
  opacity:.75;
  margin-top:3px;
}

.admin-badge{
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);
  padding:9px 15px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
}

.container{
  width:min(1100px,94%);
  margin:30px auto 70px;
}

.dashboard-title{
  font-size:34px;
  font-weight:1000;
  margin-bottom:22px;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:15px;
  margin-bottom:28px;
}

.stat{
  background:#fff;
  border-radius:20px;
  padding:23px;
  box-shadow:
    0 5px 20px rgba(30,10,50,.06);
}

.stat-label{
  color:#777;
  font-weight:700;
  font-size:14px;
}

.stat-number{
  margin-top:8px;
  color:#7426dc;
  font-size:34px;
  font-weight:1000;
}

.panel{
  background:#fff;
  border-radius:25px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:
    0 5px 25px rgba(30,10,50,.06);
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.panel-title{
  font-size:24px;
  font-weight:1000;
}

.add-btn{
  border:0;
  background:#7929e8;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

.add-btn:active{
  transform:scale(.97);
}

.search{
  width:100%;
  border:2px solid #e4d9eb;
  border-radius:14px;
  padding:15px 17px;
  outline:none;
  margin-bottom:20px;
}

.search:focus{
  border-color:#8a38ee;
}

.motor-list{
  display:grid;
  gap:15px;
}

.motor{
  border:1px solid #e8e1ec;
  border-radius:20px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:16px;
}

.motor-img{
  width:95px;
  height:95px;
  border-radius:15px;
  object-fit:cover;
  background:#f1edf4;
  flex-shrink:0;
}

.motor-main{
  flex:1;
  min-width:0;
}

.motor-name{
  font-size:20px;
  font-weight:1000;
}

.motor-brand{
  color:#7c2ee8;
  font-weight:800;
  margin-top:3px;
}

.motor-price{
  font-size:17px;
  font-weight:900;
  margin-top:5px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:900;
}

.available{
  background:#dcfce7;
  color:#16803a;
}

.sold{
  background:#fee2e2;
  color:#b42318;
}

.actions{
  display:flex;
  gap:8px;
}

.edit-btn,
.delete-btn{
  border:0;
  padding:11px 14px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}

.edit-btn{
  background:#eee5fa;
  color:#6722bb;
}

.delete-btn{
  background:#fff0ef;
  color:#c0271b;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:35px;
  color:#777;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  padding:15px;
  overflow:auto;
}

.modal{
  width:min(650px,100%);
  margin:25px auto;
  background:#fff;
  border-radius:25px;
  padding:25px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.modal-title{
  font-size:25px;
  font-weight:1000;
}

.close{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f0edf2;
  font-size:25px;
  cursor:pointer;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-weight:900;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:2px solid #e3dbe8;
  border-radius:13px;
  padding:14px;
  outline:none;
  background:#fff;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#8432e8;
}

.preview{
  width:100%;
  height:200px;
  border-radius:15px;
  object-fit:cover;
  background:#f4f1f6;
  margin-top:10px;
  display:none;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.cancel-btn,
.save-btn{
  flex:1;
  border:0;
  border-radius:14px;
  padding:16px;
  font-weight:1000;
  cursor:pointer;
}

.cancel-btn{
  background:#eee;
  color:#333;
}

.save-btn{
  background:#7929e8;
  color:#fff;
}

.message{
  display:none;
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:200;
  padding:14px 20px;
  border-radius:14px;
  color:#fff;
  font-weight:900;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.success{
  background:#16803a;
}

.error-msg{
  background:#c0271b;
}

@media(max-width:700px){

  .header{
    padding:12px 15px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .logo-title{
    font-size:18px;
  }

  .logo-sub{
    font-size:11px;
  }

  .admin-badge{
    font-size:11px;
    padding:7px 10px;
  }

  .container{
    width:92%;
    margin-top:22px;
  }

  .dashboard-title{
    font-size:28px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:16px;
  }

  .stat-number{
    font-size:27px;
  }

  .stat-label{
    font-size:11px;
  }

  .panel{
    padding:17px;
    border-radius:20px;
  }

  .panel-head{
    align-items:flex-start;
  }

  .panel-title{
    font-size:20px;
  }

  .add-btn{
    padding:11px 13px;
    font-size:13px;
  }

  .motor{
    align-items:flex-start;
  }

  .motor-img{
    width:80px;
    height:80px;
  }

  .motor-name{
    font-size:17px;
  }

  .motor-brand{
    font-size:13px;
  }

  .motor-price{
    font-size:15px;
  }

  .actions{
    flex-direction:column;
  }

  .edit-btn,
  .delete-btn{
    padding:9px 11px;
    font-size:12px;
  }

}

</style>

</head>

<body>


<header class="header">

  <div class="logo-area">

    <img
      src="xh-logo.jpg"
      class="logo"
      onerror="this.style.display='none'"
    >

    <div>

      <div class="logo-title">
        XH MOTOR
      </div>

      <div class="logo-sub">
        MOTOR CATALOG ADMIN
      </div>

    </div>

  </div>

  <div class="admin-badge">
    ADMIN
  </div>

</header>


<main class="container">


  <div class="dashboard-title">
    Dashboard
  </div>


  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        TOTAL MOTOR
      </div>

      <div
        id="totalCount"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        AVAILABLE
      </div>

      <div
        id="availableCount"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        SOLD
      </div>

      <div
        id="soldCount"
        class="stat-number"
      >
        0
      </div>

    </div>

  </section>


  <section class="panel">

    <div class="panel-head">

      <div class="panel-title">
        🏍️ Motor Catalog
      </div>

      <button
        class="add-btn"
        onclick="openAdd()"
      >
        ＋ ADD MOTOR
      </button>

    </div>


    <input
      id="search"
      class="search"
      placeholder="Search motor..."
      oninput="searchMotors()"
    >


    <div
      id="motorList"
      class="motor-list"
    >

      <div class="loading">
        Loading...
      </div>

    </div>

  </section>

</main>


<!-- MODAL -->

<div
  id="overlay"
  class="overlay"
  onclick="outsideClose(event)"
>

  <div class="modal">

    <div class="modal-head">

      <div
        id="formTitle"
        class="modal-title"
      >
        ADD MOTOR
      </div>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="motorId"
    >


    <div class="field">

      <label>
        Motor Name
      </label>

      <input
        id="title"
        placeholder="Example: Honda RS-X"
      >

    </div>


    <div class="field">

      <label>
        Brand
      </label>

      <input
        id="brand"
        placeholder="Example: Honda"
      >

    </div>


    <div class="field">

      <label>
        Price (RM)
      </label>

      <input
        id="price"
        type="number"
        placeholder="9200"
      >

    </div>


    <div class="field">

      <label>
        Status
      </label>

      <select id="statusSelect">

        <option value="AVAILABLE">
          AVAILABLE
        </option>

        <option value="SOLD">
          SOLD
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Main Image URL
      </label>

      <input
        id="imageUrl"
        placeholder="https://..."
        oninput="previewImage()"
      >

      <img
        id="preview"
        class="preview"
      >

    </div>


    <div class="field">

      <label>
        Description
      </label>

      <textarea
        id="description"
        placeholder="Motor details..."
      ></textarea>

    </div>


    <div class="form-actions">

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        CANCEL
      </button>

      <button
        class="save-btn"
        onclick="saveMotor()"
      >
        SAVE MOTOR
      </button>

    </div>

  </div>

</div>


<div
  id="message"
  class="message"
></div>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://gpcflswcaudsgzgrtiei.supabase.co";


const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cGFiYXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTQ3MTAsImV4cCI6MjEwMzA3MDcxMH0.tUSQG6ZIQuvY3LVvt60bINfJ2ayJ2-smvM1vw-MpMXY";


const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   DATA
========================================================= */

let motors = [];


/* =========================================================
   LOAD
========================================================= */

async function loadMotors(){

  const list =
    document.getElementById(
      "motorList"
    );

  list.innerHTML =
    `<div class="loading">
      Loading Motor Catalog...
    </div>`;


  const {
    data,
    error
  } =
    await db
      .from("motors")
      .select("*")
      .order(
        "title",
        {ascending:true}
      );


  if(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Unable to load motors.
        <br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  motors =
    data || [];


  updateStats();

  renderMotors();

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    motors.length;


  document.getElementById(
    "availableCount"
  ).textContent =
    motors.filter(
      m =>
        String(
          m.status || "AVAILABLE"
        ).toUpperCase()
        !== "SOLD"
    ).length;


  document.getElementById(
    "soldCount"
  ).textContent =
    motors.filter(
      m =>
        String(
          m.status || ""
        ).toUpperCase()
        === "SOLD"
    ).length;

}


/* =========================================================
   RENDER
========================================================= */

function renderMotors(){

  const list =
    document.getElementById(
      "motorList"
    );


  const keyword =
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  const filtered =
    motors.filter(
      motor =>
        JSON.stringify(motor)
          .toLowerCase()
          .includes(keyword)
    );


  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">
        No motorcycles found.
      </div>`;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(
    motor => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "motor";


      const image =
        motor.image_url ||
        motor.image ||
        motor.photo ||
        "xh-deals.jpg";


      const title =
        motor.title ||
        motor.name ||
        "XH MOTOR";


      const brand =
        motor.brand ||
        "";


      const price =
        motor.price !== null &&
        motor.price !== undefined &&
        motor.price !== ""
        ?
        "RM " +
        Number(
          motor.price
        ).toLocaleString(
          "en-MY"
        )
        :
        "";


      const status =
        String(
          motor.status ||
          "AVAILABLE"
        ).toUpperCase();


      const statusClass =
        status === "SOLD"
        ?
        "sold"
        :
        "available";


      item.innerHTML = `

        <img
          class="motor-img"
          src="${escapeHtml(image)}"
          onerror="this.src='xh-deals.jpg'"
        >

        <div class="motor-main">

          <div class="motor-name">
            ${escapeHtml(title)}
          </div>

          <div class="motor-brand">
            ${escapeHtml(brand)}
          </div>

          <div class="motor-price">
            ${escapeHtml(price)}
          </div>

          <span class="status ${statusClass}">
            ${escapeHtml(status)}
          </span>

        </div>

        <div class="actions">

          <button
            class="edit-btn"
            onclick="openEdit('${motor.id}')"
          >
            EDIT
          </button>

          <button
            class="delete-btn"
            onclick="deleteMotor('${motor.id}')"
          >
            DELETE
          </button>

        </div>

      `;


      list.appendChild(item);

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

function searchMotors(){

  renderMotors();

}


/* =========================================================
   ADD
========================================================= */

function openAdd(){

  clearForm();

  document.getElementById(
    "formTitle"
  ).textContent =
    "ADD MOTOR";


  document.getElementById(
    "overlay"
  ).style.display =
    "block";

}


/* =========================================================
   EDIT
========================================================= */

function openEdit(id){

  const motor =
    motors.find(
      m =>
        String(m.id) ===
        String(id)
    );


  if(!motor){

    showMessage(
      "Motor not found",
      true
    );

    return;

  }


  document.getElementById(
    "formTitle"
  ).textContent =
    "EDIT MOTOR";


  document.getElementById(
    "motorId"
  ).value =
    motor.id || "";


  document.getElementById(
    "title"
  ).value =
    motor.title ||
    motor.name ||
    "";


  document.getElementById(
    "brand"
  ).value =
    motor.brand ||
    "";


  document.getElementById(
    "price"
  ).value =
    motor.price ||
    "";


  document.getElementById(
    "statusSelect"
  ).value =
    String(
      motor.status ||
      "AVAILABLE"
    ).toUpperCase();


  document.getElementById(
    "imageUrl"
  ).value =
    motor.image_url ||
    motor.image ||
    "";


  document.getElementById(
    "description"
  ).value =
    motor.description ||
    "";


  previewImage();


  document.getElementById(
    "overlay"
  ).style.display =
    "block";

}


/* =========================================================
   SAVE
========================================================= */

async function saveMotor(){

  const id =
    document.getElementById(
      "motorId"
    ).value;


  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const brand =
    document.getElementById(
      "brand"
    ).value.trim();


  const price =
    document.getElementById(
      "price"
    ).value;


  const status =
    document.getElementById(
      "statusSelect"
    ).value;


  const image_url =
    document.getElementById(
      "imageUrl"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  if(!title){

    showMessage(
      "Please enter motor name",
      true
    );

    return;

  }


  const payload = {

    title:
      title,

    brand:
      brand || null,

    price:
      price === ""
      ?
      null
      :
      Number(price),

    status:
      status,

    image_url:
      image_url || null,

    description:
      description || null

  };


  let result;


  if(id){

    result =
      await db
        .from("motors")
        .update(payload)
        .eq("id",id);

  }else{

    result =
      await db
        .from("motors")
        .insert(payload);

  }


  if(result.error){

    console.error(
      result.error
    );

    showMessage(
      result.error.message,
      true
    );

    return;

  }


  closeModal();


  showMessage(
    id
    ?
    "Motor updated successfully"
    :
    "Motor added successfully"
  );


  await loadMotors();

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMotor(id){

  const motor =
    motors.find(
      m =>
        String(m.id) ===
        String(id)
    );


  const name =
    motor?.title ||
    "this motor";


  const confirmed =
    confirm(
      "Delete " +
      name +
      "?\n\nThis cannot be undone."
    );


  if(!confirmed){

    return;

  }


  const {
    error
  } =
    await db
      .from("motors")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    showMessage(
      error.message,
      true
    );

    return;

  }


  showMessage(
    "Motor deleted"
  );


  await loadMotors();

}


/* =========================================================
   FORM
========================================================= */

function clearForm(){

  document.getElementById(
    "motorId"
  ).value = "";


  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "brand"
  ).value = "";


  document.getElementById(
    "price"
  ).value = "";


  document.getElementById(
    "statusSelect"
  ).value =
    "AVAILABLE";


  document.getElementById(
    "imageUrl"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "preview"
  ).style.display =
    "none";

}


function closeModal(){

  document.getElementById(
    "overlay"
  ).style.display =
    "none";

}


function outsideClose(event){

  if(
    event.target ===
    document.getElementById(
      "overlay"
    )
  ){

    closeModal();

  }

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function previewImage(){

  const url =
    document.getElementById(
      "imageUrl"
    ).value.trim();


  const preview =
    document.getElementById(
      "preview"
    );


  if(!url){

    preview.style.display =
      "none";

    return;

  }


  preview.src =
    url;


  preview.style.display =
    "block";

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  isError=false
){

  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    "message " +
    (
      isError
      ?
      "error-msg"
      :
      "success"
    );


  box.style.display =
    "block";


  setTimeout(
    () => {

      box.style.display =
        "none";

    },
    3000
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  loadMotors
);

</script>
