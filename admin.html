<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XH MOTOR — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7fa;
  color:#15121c;
}
.header{
  background:linear-gradient(110deg,#7b20e8,#8f35ff,#6920c5);
  color:#fff;
  padding:22px 30px;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:22px;
  background:#fff;
}
.brand h1{
  margin:0;
  font-size:32px;
  font-weight:900;
}
.brand p{
  margin:7px 0 0;
  font-size:19px;
  font-weight:700;
  opacity:.8;
}
.admin{
  margin-left:auto;
  border:2px solid rgba(255,255,255,.45);
  border-radius:35px;
  padding:13px 25px;
  font-size:20px;
  font-weight:900;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:45px 25px 80px;
}
h2{
  font-size:52px;
  margin:0 0 35px;
  font-weight:900;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-bottom:45px;
}
.stat{
  background:#fff;
  border-radius:30px;
  padding:30px;
  box-shadow:0 8px 30px rgba(50,20,80,.08);
}
.stat span{
  display:block;
  color:#777;
  font-weight:900;
  font-size:20px;
}
.stat strong{
  display:block;
  margin-top:20px;
  color:#7428e5;
  font-size:52px;
}
.panel{
  background:#fff;
  border-radius:30px;
  padding:32px;
  box-shadow:0 8px 30px rgba(50,20,80,.08);
}
.panel-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}
.panel-title{
  font-size:34px;
  font-weight:900;
}
button{
  border:0;
  cursor:pointer;
  font-weight:900;
}
.add{
  background:#7d25eb;
  color:#fff;
  padding:17px 25px;
  border-radius:18px;
  font-size:18px;
}
.search{
  width:100%;
  padding:19px 22px;
  border:3px solid #eadcf5;
  border-radius:20px;
  font-size:18px;
  outline:none;
  margin-bottom:25px;
}
.motor{
  border:2px solid #eadcf5;
  border-radius:25px;
  overflow:hidden;
  margin-bottom:25px;
  background:#fff;
}
.motor-body{
  padding:25px;
}
.motor-title{
  font-size:28px;
  font-weight:900;
}
.motor-brand{
  color:#7b28e8;
  font-size:20px;
  font-weight:900;
  margin-top:8px;
}
.motor-price{
  font-size:26px;
  font-weight:900;
  margin-top:15px;
}
.motor-status{
  display:inline-block;
  margin-top:12px;
  padding:7px 13px;
  border-radius:20px;
  background:#eee;
  font-weight:800;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.edit{
  background:#7d25eb;
  color:white;
  padding:12px 20px;
  border-radius:12px;
}
.delete{
  background:#f1eeee;
  color:#d22;
  padding:12px 20px;
  border-radius:12px;
}
.empty,.error{
  padding:50px 20px;
  text-align:center;
  color:#888;
  font-size:20px;
  font-weight:700;
}
.error{
  color:#d33;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:99;
  padding:20px;
  overflow:auto;
}
.modal-box{
  background:#fff;
  max-width:650px;
  margin:30px auto;
  border-radius:28px;
  padding:30px;
}
.modal-box h3{
  margin-top:0;
  font-size:32px;
}
label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:900;
}
input,textarea,select{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:13px;
  font-size:16px;
}
textarea{
  min-height:100px;
}
.save{
  width:100%;
  margin-top:25px;
  padding:17px;
  border-radius:15px;
  background:#7d25eb;
  color:#fff;
  font-size:18px;
}
.cancel{
  width:100%;
  margin-top:10px;
  padding:15px;
  border-radius:15px;
  background:#eee;
  font-size:17px;
}
@media(max-width:700px){
  .header{padding:15px 18px}
  .logo{width:65px;height:65px}
  .brand h1{font-size:24px}
  .brand p{font-size:14px}
  .admin{font-size:14px;padding:10px 15px}
  .container{padding:30px 16px}
  h2{font-size:42px}
  .stats{grid-template-columns:1fr;gap:14px}
  .stat{padding:22px}
  .stat strong{font-size:42px}
  .panel{padding:20px}
  .panel-top{align-items:flex-start;flex-direction:column}
  .add{width:100%}
}
</style>
</head>

<body>

<header class="header">

  <!-- 如果你的 logo 文件名称不同，可以改这里 -->
  <img src="xh-logo.jpg" class="logo" onerror="this.style.display='none'">

  <div class="brand">
    <h1>XH MOTOR</h1>
    <p>MOTOR CATALOG ADMIN</p>
  </div>

  <div class="admin">ADMIN</div>

</header>

<main class="container">

<h2>Dashboard</h2>

<section class="stats">
  <div class="stat">
    <span>TOTAL MOTOR</span>
    <strong id="total">0</strong>
  </div>

  <div class="stat">
    <span>AVAILABLE</span>
    <strong id="available">0</strong>
  </div>

  <div class="stat">
    <span>SOLD</span>
    <strong id="sold">0</strong>
  </div>
</section>

<section class="panel">

  <div class="panel-top">
    <div class="panel-title">🏍️ Motor Catalog</div>
    <button class="add" onclick="openAdd()">＋ ADD MOTOR</button>
  </div>

  <input
    class="search"
    id="search"
    placeholder="Search motor..."
    oninput="render()"
  >

  <div id="list">
    <div class="empty">Loading Motor Catalog...</div>
  </div>

</section>

</main>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<h3 id="modalTitle">ADD MOTOR</h3>

<input type="hidden" id="motorId">

<label>Motor Title</label>
<input id="title" placeholder="Honda RS-X">

<label>Brand</label>
<input id="brand" placeholder="Honda">

<label>Price</label>
<input id="price" placeholder="9200">

<label>Main Photo URL</label>
<input id="image" placeholder="https://...jpg">

<label>Description</label>
<textarea id="description" placeholder="Quality bikes • Trusted deals"></textarea>

<label>Status</label>
<select id="status">
  <option value="available">Available</option>
  <option value="sold">Sold</option>
</select>

<label>WhatsApp</label>
<input id="whatsapp" placeholder="60123456789">

<button class="save" onclick="saveMotor()">SAVE MOTOR</button>
<button class="cancel" onclick="closeModal()">CANCEL</button>

</div>
</div>

<script>

/* =====================================================
   XH MOTOR SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
"https://gpcflswcaudsgzgrtiei.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwY2Zsc3djYXVkc2d6Z3J0aWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTQ3MTAsImV4cCI6MjEwMzA3MDcxMH0.tUSQG6ZIQuvY3LVvt60bINfJ2ayJ2-smvM1vw-MpMXY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let motors = [];

/* =====================================================
   LOAD
   ===================================================== */

async function loadMotors(){

  const list = document.getElementById("list");

  list.innerHTML =
    '<div class="empty">Loading Motor Catalog...</div>';

  try{

    const {data,error} =
      await supabaseClient
      .from("motors")
      .select("*")
      .order("created_at",{ascending:false});

    if(error) throw error;

    motors = data || [];

    updateStats();
    render();

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="error">
        Unable to load motors.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}

/* =====================================================
   STATS
   ===================================================== */

function updateStats(){

  const total = motors.length;

  const available =
    motors.filter(m =>
      String(m.status || "available").toLowerCase()
      !== "sold"
    ).length;

  const sold =
    motors.filter(m =>
      String(m.status || "").toLowerCase()
      === "sold"
    ).length;

  document.getElementById("total").textContent = total;
  document.getElementById("available").textContent = available;
  document.getElementById("sold").textContent = sold;

}

/* =====================================================
   RENDER
   ===================================================== */

function render(){

  const list =
    document.getElementById("list");

  const q =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const filtered =
    motors.filter(m => {

      const text = `
        ${m.title || ""}
        ${m.brand || ""}
        ${m.description || ""}
      `.toLowerCase();

      return text.includes(q);

    });

  if(!filtered.length){

    list.innerHTML =
      '<div class="empty">No motors found.</div>';

    return;

  }

  list.innerHTML =
    filtered.map(m => `

      <div class="motor">

        ${
          m.image_url
          ? `
            <img
              src="${escapeAttr(m.image_url)}"
              style="
                width:100%;
                max-height:380px;
                object-fit:cover;
                display:block;
              "
            >
          `
          : ""
        }

        <div class="motor-body">

          <div class="motor-title">
            ${escapeHtml(m.title || "Untitled Motor")}
          </div>

          <div class="motor-brand">
            ${escapeHtml(m.brand || "")}
          </div>

          <div class="motor-price">
            RM ${formatPrice(m.price)}
          </div>

          <div class="motor-status">
            ${
              String(m.status || "available").toLowerCase()
              === "sold"
              ? "SOLD"
              : "AVAILABLE"
            }
          </div>

          <div style="
            margin-top:12px;
            color:#777;
            line-height:1.5;
          ">
            ${escapeHtml(m.description || "")}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="openEdit('${m.id}')">
              EDIT
            </button>

            <button
              class="delete"
              onclick="deleteMotor('${m.id}')">
              DELETE
            </button>

          </div>

        </div>

      </div>

    `).join("");

}

/* =====================================================
   ADD
   ===================================================== */

function openAdd(){

  document.getElementById("modalTitle")
    .textContent = "ADD MOTOR";

  document.getElementById("motorId").value = "";

  document.getElementById("title").value = "";
  document.getElementById("brand").value = "";
  document.getElementById("price").value = "";
  document.getElementById("image").value = "";
  document.getElementById("description").value = "";
  document.getElementById("status").value = "available";
  document.getElementById("whatsapp").value = "";

  document.getElementById("modal")
    .style.display = "block";

}

/* =====================================================
   EDIT
   ===================================================== */

function openEdit(id){

  const motor =
    motors.find(m => String(m.id) === String(id));

  if(!motor) return;

  document.getElementById("modalTitle")
    .textContent = "EDIT MOTOR";

  document.getElementById("motorId").value =
    motor.id;

  document.getElementById("title").value =
    motor.title || "";

  document.getElementById("brand").value =
    motor.brand || "";

  document.getElementById("price").value =
    motor.price || "";

  document.getElementById("image").value =
    motor.image_url || motor.image || "";

  document.getElementById("description").value =
    motor.description || "";

  document.getElementById("status").value =
    motor.status || "available";

  document.getElementById("whatsapp").value =
    motor.whatsapp || "";

  document.getElementById("modal")
    .style.display = "block";

}

/* =====================================================
   CLOSE
   ===================================================== */

function closeModal(){

  document.getElementById("modal")
    .style.display = "none";

}

/* =====================================================
   SAVE
   ===================================================== */

async function saveMotor(){

  const id =
    document.getElementById("motorId").value;

  const title =
    document.getElementById("title").value.trim();

  const brand =
    document.getElementById("brand").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const status =
    document.getElementById("status").value;

  const whatsapp =
    document.getElementById("whatsapp").value.trim();

  if(!title){

    alert("Please enter Motor Title.");
    return;

  }

  const payload = {

    title: title,

    brand: brand,

    price: Number(price) || 0,

    image_url: image,

    description: description,

    status: status,

    whatsapp: whatsapp

  };

  try{

    let result;

    if(id){

      result =
        await supabaseClient
        .from("motors")
        .update(payload)
        .eq("id",id);

    }else{

      result =
        await supabaseClient
        .from("motors")
        .insert([payload]);

    }

    if(result.error)
      throw result.error;

    closeModal();

    await loadMotors();

    alert("Motor saved successfully.");

  }catch(error){

    console.error(error);

    alert(
      "Unable to save motor:\n\n" +
      error.message
    );

  }

}

/* =====================================================
   DELETE
   ===================================================== */

async function deleteMotor(id){

  const ok =
    confirm(
      "Delete this motor?\n\nThis cannot be undone."
    );

  if(!ok) return;

  try{

    const {error} =
      await supabaseClient
      .from("motors")
      .delete()
      .eq("id",id);

    if(error) throw error;

    await loadMotors();

  }catch(error){

    console.error(error);

    alert(
      "Unable to delete motor:\n\n" +
      error.message
    );

  }

}

/* =====================================================
   HELPERS
   ===================================================== */

function formatPrice(value){

  const number =
    Number(value) || 0;

  return number.toLocaleString("en-MY");

}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}

/* =====================================================
   START
   ===================================================== */

loadMotors();

</script>

</body>
</html>
